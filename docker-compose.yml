services:
  astra-init:
    build: .
    image: astra:local
    container_name: astra-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown node:node /app/data /app/backups && chmod 700 /app/data /app/backups"]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  astra:
    build: .
    image: astra:local
    container_name: astra-bot
    depends_on:
      astra-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - astra-internal

  caddy-init:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: astra-caddy:local
    container_name: astra-caddy-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /data /config && chmod 700 /data /config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: astra-caddy:local
    container_name: astra-caddy
    user: "1000:1000"
    depends_on:
      astra:
        condition: service_healthy
      caddy-init:
        condition: service_completed_successfully
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - astra-internal

networks:
  astra-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
